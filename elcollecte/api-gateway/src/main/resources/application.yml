server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # ── Auth (public — no AuthFilter) ──────────────────────────────────
        - id: auth-public
          uri: lb://service-utilisateur
          predicates:
            - Path=/api/auth/**

        # ── Users ──────────────────────────────────────────────────────────
        - id: users-service
          uri: lb://service-utilisateur
          predicates:
            - Path=/api/users/**
          filters:
            - AuthFilter

        # ── Profils (Phase 1 IAM) ───────────────────────────────────────────
        - id: profils-service
          uri: lb://service-utilisateur
          predicates:
            - Path=/api/profils/**
          filters:
            - AuthFilter

        # ── Permissions (Phase 1 IAM) ───────────────────────────────────────
        - id: permissions-service
          uri: lb://service-utilisateur
          predicates:
            - Path=/api/permissions/**
          filters:
            - AuthFilter

        # ── Projets ────────────────────────────────────────────────────────
        - id: projets-service
          uri: lb://service-projet
          predicates:
            - Path=/api/projets/**
          filters:
            - AuthFilter

        # ── Formulaires EIES (service-formulaire-eies sur port 8091) ───────
        - id: formulaires-service
          uri: lb://service-formulaire-eies
          predicates:
            - Path=/api/formulaires/**
          filters:
            - AuthFilter

        # ── Missions ───────────────────────────────────────────────────────
        - id: missions-service
          uri: lb://service-mission
          predicates:
            - Path=/api/missions/**
          filters:
            - AuthFilter

        # ── Cartographie ───────────────────────────────────────────────────
        - id: cartographie-service
          uri: lb://service-cartographie
          predicates:
            - Path=/api/cartographie/**
          filters:
            - AuthFilter

        # ── Synchronisation ────────────────────────────────────────────────
        - id: synchronisation-service
          uri: lb://service-synchronisation
          predicates:
            - Path=/api/synchronisation/**
          filters:
            - AuthFilter

        # ── Collectes ──────────────────────────────────────────────────────
        - id: collectes-service
          uri: lb://service-collecte
          predicates:
            - Path=/api/collectes/**
          filters:
            - AuthFilter

        # ── Médias ─────────────────────────────────────────────────────────
        - id: media-service
          uri: lb://service-media
          predicates:
            - Path=/api/medias/**
          filters:
            - AuthFilter

        # ── Validation (health public, reste protégé) ───────────────────────
        - id: validation-health
          uri: lb://service-validation
          predicates:
            - Path=/api/validations/health

        - id: validation-service
          uri: lb://service-validation
          predicates:
            - Path=/api/validations/**
          filters:
            - AuthFilter

        # ── Audit ─────────────────────────────────────────────────────────
        - id: audit-service
          uri: lb://service-audit
          predicates:
            - Path=/api/audit/**
          filters:
            - AuthFilter

        # ── Analytique ─────────────────────────────────────────────────────
        - id: analytique-service
          uri: lb://service-analytique
          predicates:
            - Path=/api/analytics/**
          filters:
            - AuthFilter

        # ── Rapports ───────────────────────────────────────────────────────
        - id: rapport-service
          uri: lb://service-rapport
          predicates:
            - Path=/api/rapports/**
          filters:
            - AuthFilter


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    redis:
      enabled: false

jwt:
  secret: ${JWT_SECRET:elcollecte-super-secret-key-2025}

eureka:
  client:
    serviceUrl:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka
  instance:
    preferIpAddress: true