  server:
    port: 8080

  spring:
    application:
      name: api-gateway

    cloud:
      gateway:

        # ============================================================
        # CORS GLOBAL
        # ============================================================
        globalcors:
          add-to-simple-url-handler-mapping: true

          cors-configurations:
            '[/**]':
              allowedOrigins:
                - "http://localhost:5173"
                - "http://127.0.0.1:5173"
                - "http://localhost:5500"
                - "http://127.0.0.1:5500"
                - "https://0qjpzb9f-5173.uks1.devtunnels.ms"

              allowedMethods:
                - GET
                - POST
                - PUT
                - DELETE
                - PATCH
                - OPTIONS

              allowedHeaders:
                - "*"

              exposedHeaders:
                - "*"

              allowCredentials: true

              maxAge: 3600

        # ============================================================
        # ROUTES
        # ============================================================
        routes:

          # ------------------------------------------------------------
          # AUTHENTIFICATION
          # Public : aucun AuthFilter
          # ------------------------------------------------------------
          - id: auth-public
            uri: lb://service-utilisateur
            predicates:
              - Path=/api/auth/**

          # ------------------------------------------------------------
          # UTILISATEURS
          # ------------------------------------------------------------
          - id: users-service
            uri: lb://service-utilisateur
            predicates:
              - Path=/api/users/**
            filters:
              - AuthFilter

          # ------------------------------------------------------------
          # PROJETS
          # ------------------------------------------------------------
          - id: projets-service
            uri: lb://service-projet
            predicates:
              - Path=/api/projets/**
            filters:
              - AuthFilter

          # ------------------------------------------------------------
          # FORMULAIRES EIES
          # ------------------------------------------------------------
          - id: formulaires-eies-service
            uri: lb://service-formulaire-eies
            predicates:
              - Path=/api/formulaires/**
            filters:
              - AuthFilter

          # ------------------------------------------------------------
          # COLLECTES
          # ------------------------------------------------------------
          - id: collectes-service
            uri: lb://service-collecte
            predicates:
              - Path=/api/collectes/**
            filters:
              - AuthFilter

          # ------------------------------------------------------------
          # MEDIAS
          # ------------------------------------------------------------
          - id: media-service
            uri: lb://service-media
            predicates:
              - Path=/api/medias/**
            filters:
              - AuthFilter

          # ------------------------------------------------------------
          # VALIDATION - HEALTH
          # Public
          # ------------------------------------------------------------
          - id: validation-health
            uri: lb://service-validation
            predicates:
              - Path=/api/validations/health

          # ------------------------------------------------------------
          # VALIDATION
          # ------------------------------------------------------------
          - id: validation-service
            uri: lb://service-validation
            predicates:
              - Path=/api/validations/**
            filters:
              - AuthFilter

          # ------------------------------------------------------------
          # ANALYTIQUE
          # ------------------------------------------------------------
          - id: analytique-service
            uri: lb://service-analytique
            predicates:
              - Path=/api/analytics/**
            filters:
              - AuthFilter

          # ------------------------------------------------------------
          # RAPPORTS
          # ------------------------------------------------------------
          - id: rapport-service
            uri: lb://service-rapport
            predicates:
              - Path=/api/rapports/**
            filters:
              - AuthFilter


  # ================================================================
  # ACTUATOR
  # ================================================================
  management:
    endpoints:
      web:
        exposure:
          include: health,info,metrics

    health:
      redis:
        enabled: false


  # ================================================================
  # JWT
  # ================================================================
  jwt:
    secret: ${JWT_SECRET:elcollecte-super-secret-key-2025}


  # ================================================================
  # EUREKA
  # ================================================================
  eureka:
    client:
      serviceUrl:
        defaultZone: http://${EUREKA_HOST:localhost}:8765/eureka

    instance:
      preferIpAddress: true
